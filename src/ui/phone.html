<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TVCouchBrowser</title>
<style>
  :root { color-scheme: dark; --bg:#101318; --card:#1b2230; --accent:#4DA3FF; --text:#e8eef5; --dim:#9fb3c8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px -apple-system, system-ui, sans-serif; }
  header { padding:16px 18px 4px; font-weight:700; font-size:20px; display:flex; align-items:center; gap:10px; }
  #dot { width:10px; height:10px; border-radius:50%; background:#5c6b7d; }
  #dot.on { background:#3ccf7a; }
  #dotLabel { font-size:13px; font-weight:400; color:var(--dim); }
  section { background:var(--card); margin:12px; padding:14px; border-radius:16px; }
  h2 { margin:0 0 10px; font-size:15px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  input, textarea { width:100%; font:inherit; color:var(--text); background:#0c0f14; border:1px solid #2c3647;
    border-radius:12px; padding:12px; }
  textarea { height:84px; resize:none; }
  .row { display:flex; gap:8px; margin-top:10px; }
  button { flex:1; font:inherit; font-weight:600; color:var(--text); background:#2a3446; border:0; border-radius:12px;
    padding:14px 8px; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  button.primary { background:var(--accent); color:#06121f; }
  button:active, button.held { filter:brightness(1.3); }
  .small button { padding:12px 4px; font-size:15px; }
  .pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; max-width:330px; margin:0 auto; }
  .pad button { padding:22px 0; font-size:22px; }
  .pad .ok { background:var(--accent); color:#06121f; border-radius:50%; aspect-ratio:1; }
  #track { height:46vh; min-height:240px; border-radius:14px; background:#0c0f14; border:1px solid #2c3647;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    display:flex; align-items:center; justify-content:center; text-align:center; color:#56657a; font-size:14px;
    line-height:1.6; padding:16px; }
  #track.hold { border-color:var(--accent); background:#0f1a28; }
  #track.drag { border-color:#3ccf7a; background:#0f2218; }
  #sens { display:flex; align-items:center; gap:10px; margin-top:10px; color:var(--dim); font-size:15px; }
  #sens input { flex:1; padding:0; }
  #live { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--dim); font-size:15px; }
  #live input { width:auto; }
  #status { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#000c; padding:8px 16px;
    border-radius:20px; opacity:0; transition:opacity .2s; pointer-events:none; }
</style>
</head>
<body>
<header>TVCouchBrowser <span id="dot"></span><span id="dotLabel">trackpad connecting…</span></header>

<section>
  <h2>Open on TV</h2>
  <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="Website or search">
  <div class="row"><button class="primary" id="open">Open</button></div>
</section>

<section>
  <h2>Trackpad</h2>
  <div id="track">Drag to move · Tap to click<br>Two fingers: scroll · pinch to zoom · tap for long press<br>
    Hold still, then drag: press and drag (sliders)</div>
  <div class="row small">
    <button class="primary" data-p="c">Click</button>
    <button id="hold">Hold</button>
    <button data-p="l">Long press</button>
  </div>
  <div class="row small">
    <button data-p="x">✂ Remove</button>
    <button data-p="k">🧹 Clean up</button>
    <button data-p="z -1">Zoom −</button>
    <button data-p="z 1">Zoom +</button>
  </div>
  <label id="sens">Speed <input type="range" id="speed" min="0.5" max="4" step="0.1" value="1.6"></label>
</section>

<section>
  <h2>Type into the TV</h2>
  <textarea id="text" placeholder="Select a text box on the TV, then type here" autocapitalize="off"></textarea>
  <label id="live"><input type="checkbox" id="liveBox"> Send as I type</label>
  <div class="row">
    <button class="primary" id="send">Send</button>
    <button id="enter">Enter ⏎</button>
    <button id="bksp">⌫</button>
  </div>
</section>

<section>
  <h2>Remote</h2>
  <div class="pad">
    <button data-k="back">↩</button><button data-k="up">▲</button><button data-k="menu">☰</button>
    <button data-k="left">◀</button><button data-k="ok" class="ok">OK</button><button data-k="right">▶</button>
    <button data-k="playpause">⏯</button><button data-k="down">▼</button><button data-k="mode">⇄</button>
  </div>
</section>

<div id="status"></div>

<script>
  const token = new URLSearchParams(location.search).get('t') || '';
  const $ = (id) => document.getElementById(id);
  let statusTimer;
  const status = (msg) => {
    const s = $('status'); s.textContent = msg; s.style.opacity = 1;
    clearTimeout(statusTimer); statusTimer = setTimeout(() => s.style.opacity = 0, 1400);
  };
  const post = async (path, body) => {
    try {
      const r = await fetch(path + (path.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token), {
        method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: body || '' });
      if (r.status === 403) { status('Link expired: scan the QR code again'); return false; }
      if (!r.ok) { status('The TV said no'); return false; }
      return true;
    } catch (e) { status('TV not reachable: is the browser open?'); return false; }
  };

  // Storage can be missing or throw (private browsing); the defaults are fine then.
  const store = {
    get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
  };

  $('open').onclick = async () => {
    const v = $('url').value.trim(); if (!v) return;
    if (await post('/open', v)) { status('Opened on TV'); $('url').value = ''; }
  };
  $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('open').click(); });

  let sent = '';
  $('send').onclick = async () => {
    const v = $('text').value; if (!v) return;
    if (await post('/type', v)) { status('Sent'); $('text').value = ''; sent = ''; }
  };
  // Live mode sends only what was added at the end, and backspaces for what was deleted.
  $('text').addEventListener('input', async () => {
    if (!$('liveBox').checked) return;
    const v = $('text').value;
    let common = 0;
    while (common < v.length && common < sent.length && v[common] === sent[common]) common++;
    const removed = sent.length - common; const added = v.slice(common);
    sent = v;
    for (let i = 0; i < removed; i++) await post('/key?k=backspace');
    if (added) await post('/type', added);
  });
  $('liveBox').onchange = () => { sent = $('text').value = ''; };
  $('enter').onclick = () => post('/key?k=enter').then((ok) => { if (ok) { $('text').value = ''; sent = ''; } });
  $('bksp').onclick = () => post('/key?k=backspace');
  for (const b of document.querySelectorAll('[data-k]')) b.onclick = () => post('/key?k=' + b.dataset.k);

  // ---- trackpad: a WebSocket back to the TV carrying short commands ----
  let ws = null; let retry = 1000; let failures = 0; let keepAlive = 0;
  const setDot = (on, label) => { $('dot').classList.toggle('on', on); $('dotLabel').textContent = label; };
  const connect = () => {
    if (ws && ws.readyState <= 1) return;
    try { ws = new WebSocket('ws://' + location.host + '/ws?t=' + encodeURIComponent(token)); }
    catch (e) { setDot(false, 'trackpad unavailable'); return; }
    ws.onopen = () => {
      retry = 1000; failures = 0; setDot(true, 'trackpad connected');
      clearInterval(keepAlive); keepAlive = setInterval(() => send('p'), 10000);
    };
    ws.onclose = () => {
      clearInterval(keepAlive);
      failures++;
      setDot(false, failures > 3 ? 'TV not reachable: is the browser open?' : 'trackpad reconnecting…');
      if (document.visibilityState === 'visible') setTimeout(connect, retry);
      retry = Math.min(retry * 2, 8000);
    };
  };
  const send = (msg) => { if (ws && ws.readyState === 1) ws.send(msg); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { retry = 1000; connect(); } });
  connect();

  let speed = parseFloat(store.get('tvcb-speed', '1.6')) || 1.6;
  $('speed').value = speed;
  $('speed').oninput = () => { speed = parseFloat($('speed').value); store.set('tvcb-speed', String(speed)); };

  // Moves and scrolls are added up and sent at most once per frame (about 60 a second).
  let mx = 0, my = 0, sx = 0, sy = 0, frame = 0;
  const flush = () => {
    frame = 0;
    const ix = Math.trunc(mx), iy = Math.trunc(my);
    if (ix || iy) { send('m ' + ix + ' ' + iy); mx -= ix; my -= iy; }
    const jx = Math.trunc(sx), jy = Math.trunc(sy);
    if (jx || jy) { send('s ' + jx + ' ' + jy); sx -= jx; sy -= jy; }
  };
  const schedule = () => { if (!frame) frame = requestAnimationFrame(flush); };

  const pad = $('track');
  const T = { start: null, last: null, moved: false, armed: false, dragging: false, two: false, twoMoved: false,
    twoStart: 0, base: 0, cx: 0, cy: 0, armTimer: 0 };
  const centroid = (ts) => ({ x: (ts[0].clientX + ts[1].clientX) / 2, y: (ts[0].clientY + ts[1].clientY) / 2 });
  const spread = (ts) => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
  const setPad = () => { pad.classList.toggle('hold', T.armed && !T.dragging); pad.classList.toggle('drag', T.dragging); };

  pad.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const ts = e.touches;
    if (ts.length === 1 && !T.two) {
      const t = ts[0];
      T.start = { x: t.clientX, y: t.clientY, time: performance.now() };
      T.last = { x: t.clientX, y: t.clientY, time: performance.now() };
      T.moved = false; T.armed = false;
      clearTimeout(T.armTimer);
      // Holding still arms a press: moving then drags, letting go is a long press.
      T.armTimer = setTimeout(() => { if (!T.moved) { T.armed = true; setPad(); } }, 400);
    } else if (ts.length === 2) {
      clearTimeout(T.armTimer);
      if (T.dragging) { send('u'); T.dragging = false; }
      T.armed = false; T.two = true; T.twoMoved = false; T.twoDist = 0; T.twoStart = performance.now();
      const c = centroid(ts); T.cx = c.x; T.cy = c.y; T.base = spread(ts);
      setPad();
    }
  }, { passive: false });

  pad.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const ts = e.touches;
    if (T.two) {
      if (ts.length < 2) return;
      const c = centroid(ts);
      const dx = c.x - T.cx, dy = c.y - T.cy;
      T.cx = c.x; T.cy = c.y;
      const d = spread(ts);
      const ratio = T.base ? d / T.base : 1;
      if (ratio > 1.3 || ratio < 0.77) { send('z ' + (ratio > 1 ? 1 : -1)); T.base = d; T.twoMoved = true; return; }
      // Content follows the fingers, as on the phone itself.
      sx -= dx; sy -= dy; schedule();
      T.twoDist += Math.abs(dx) + Math.abs(dy);
      if (T.twoDist > 10) T.twoMoved = true;
      return;
    }
    if (ts.length !== 1 || !T.last) return;
    const t = ts[0];
    const now = performance.now();
    const dx = t.clientX - T.last.x, dy = t.clientY - T.last.y;
    const dt = Math.max(now - T.last.time, 1);
    T.last = { x: t.clientX, y: t.clientY, time: now };
    if (!T.moved && Math.hypot(t.clientX - T.start.x, t.clientY - T.start.y) > 8) {
      T.moved = true; clearTimeout(T.armTimer);
      if (T.armed && !T.dragging) { T.dragging = true; send('d'); setPad(); }
    }
    if (!T.moved) return;
    // Pointer acceleration: slow moves are precise, fast flicks cross the screen.
    const v = Math.hypot(dx, dy) / dt; // px per ms
    const gain = speed * (1 + Math.min(Math.max(v - 0.25, 0) * 2.2, 3.5));
    mx += dx * gain; my += dy * gain; schedule();
  }, { passive: false });

  const touchEnd = (e) => {
    e.preventDefault();
    if (e.touches.length > 0) return;
    clearTimeout(T.armTimer);
    if (T.two) {
      if (!T.twoMoved && performance.now() - T.twoStart < 350) send('l');
      T.two = false;
    } else if (T.dragging) {
      flush(); send('u');
    } else if (T.start) {
      const quick = performance.now() - T.start.time < 300;
      if (T.armed && !T.moved) send('l');
      else if (!T.moved && quick) send('c');
    }
    T.dragging = false; T.armed = false; T.start = null; T.last = null;
    setPad();
  };
  pad.addEventListener('touchend', touchEnd, { passive: false });
  pad.addEventListener('touchcancel', touchEnd, { passive: false });

  for (const b of document.querySelectorAll('[data-p]')) b.onclick = () => send(b.dataset.p);
  // Hold: pressed for as long as the finger stays on the button (press-and-hold checks).
  const hold = $('hold');
  const holdDown = (e) => { e.preventDefault(); hold.classList.add('held'); send('d'); };
  const holdUp = (e) => { e.preventDefault(); if (hold.classList.contains('held')) { hold.classList.remove('held'); send('u'); } };
  hold.addEventListener('touchstart', holdDown, { passive: false });
  hold.addEventListener('touchend', holdUp, { passive: false });
  hold.addEventListener('touchcancel', holdUp, { passive: false });
  hold.addEventListener('mousedown', holdDown);
  hold.addEventListener('mouseup', holdUp);
</script>
</body>
</html>
